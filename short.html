<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>YouTube Short — ER:LC TV</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#101824;--line:#1e2b3c;--blue:#2388ff;--muted:#91a0b4;--text:#f4f7fb}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;font-weight:850;font-size:19px}
.mark{display:inline-grid;place-items:center;background:#2388ff;border-radius:10px;width:34px;height:34px;margin-right:10px}
.wrap{height:calc(100dvh - 58px);max-width:1100px;margin:0 auto;padding:14px 20px;display:grid;grid-template-columns:minmax(210px, min(34vw,360px)) minmax(0,1fr);gap:24px;align-items:center;justify-content:center}
.player{height:100%;max-height:calc(100dvh - 86px);aspect-ratio:9/16;width:auto;justify-self:center;background:#000;border:1px solid var(--line);border-radius:15px;overflow:hidden}
.player iframe{width:100%;height:100%;border:0;display:block}
.details{min-width:0;max-height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.title{font-size:clamp(21px,3vw,34px);line-height:1.16;margin:0 0 9px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.creator{display:flex;align-items:center;gap:11px;padding:11px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:15px;min-width:0}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#26364a;flex:none}
.creator strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.creator .muted{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.desc{white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;background:var(--panel);border:1px solid var(--line);padding:13px;border-radius:12px;margin-top:12px;font-size:13px}
.muted{color:var(--muted)}.error{color:#ff9292;padding:20px}
@media(max-width:700px){
 .top{height:48px;padding:0 12px;font-size:17px}.mark{width:29px;height:29px}
 .wrap{height:calc(100dvh - 48px);padding:10px;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:12px}
 .player{height:auto;width:100%;aspect-ratio:9/16;max-height:calc(100dvh - 68px);border-radius:11px}
 .details{max-height:100%;gap:0}.title{font-size:clamp(16px,4.5vw,23px);-webkit-line-clamp:3;margin-bottom:7px}
 .meta{font-size:11px;gap:7px}.creator{padding:8px;gap:8px;margin-top:10px}.avatar{width:32px;height:32px}
 .creator .muted{font-size:10px}.desc{font-size:11px;line-height:1.35;padding:9px;margin-top:9px;-webkit-line-clamp:6}
}
@media(max-height:500px) and (orientation:landscape){
 .top{height:42px}.wrap{height:calc(100dvh - 42px);padding:6px 12px;grid-template-columns:auto minmax(0,1fr);gap:18px}
 .player{height:100%;width:auto;aspect-ratio:9/16;max-height:calc(100dvh - 54px)}
 .title{font-size:20px;-webkit-line-clamp:2}.creator{margin-top:7px;padding:7px}.desc{margin-top:7px;padding:8px;-webkit-line-clamp:3}
}
</style></head><body><header class="top"><a href="./"><span class="mark">▶</span>ER:LC TV</a></header><main class="wrap"><div id="status" class="muted">Loading Short…</div><section id="content" hidden style="display:contents"><div class="player"><iframe id="frame" title="YouTube Short player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div class="details"><h1 id="title" class="title"></h1><div class="meta"><span id="date"></span><a id="youtube" target="_blank" rel="noopener">Watch on YouTube ↗</a></div><a id="channel" class="creator"><img id="avatar" class="avatar" alt=""><span><strong id="channelName"></strong><span class="muted" id="youtubeName"></span></span></a><div id="description" class="desc"></div></div></section></main>
<script>
const API='https://erlctv.gavunblake.workers.dev',id=new URLSearchParams(location.search).get('id'),status=document.getElementById('status');
(async()=>{if(!id){status.textContent='No Short was specified.';status.className='error';return}try{const r=await fetch(API+'/shorts/public?id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Short not found.');const v=d.short;document.title=v.title+' — ER:LC TV';document.getElementById('frame').src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.youtube_short_id)+'?autoplay=1&mute=1&loop=1&playlist='+encodeURIComponent(v.youtube_short_id)+'&playsinline=1&rel=0';document.getElementById('title').textContent=v.title;document.getElementById('date').textContent='Published '+new Date(v.youtube_published_at*1000).toLocaleDateString();document.getElementById('youtube').href='https://www.youtube.com/shorts/'+encodeURIComponent(v.youtube_short_id);document.getElementById('channel').href='./channel.html?slug='+encodeURIComponent(v.channel_slug);document.getElementById('channelName').textContent=v.channel_name;document.getElementById('youtubeName').textContent=v.youtube_channel_title;if(v.youtube_thumbnail_url)document.getElementById('avatar').src=v.youtube_thumbnail_url;else document.getElementById('avatar').hidden=true;document.getElementById('description').textContent=v.description||'No description provided.';status.hidden=true;document.getElementById('content').hidden=false}catch(e){status.textContent=e.message;status.className='error'}})();
</script></body></html>
