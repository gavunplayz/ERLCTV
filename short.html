<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>YouTube Short — ER:LC TV</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#101824;--line:#1e2b3c;--blue:#2388ff;--muted:#91a0b4;--text:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(20px,calc((100% - 1100px)/2));font-weight:850;font-size:20px}.mark{display:inline-grid;place-items:center;background:#2388ff;border-radius:10px;width:35px;height:35px;margin-right:10px}.wrap{max-width:1000px;margin:30px auto;padding:0 20px;display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:30px;align-items:start}.player{width:100%;aspect-ratio:9/16;max-height:calc(100vh - 125px);background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden}.player iframe{width:100%;height:100%;border:0}.details{padding-top:12px}.title{font-size:clamp(23px,4vw,34px);line-height:1.2;margin:0 0 12px}.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted)}.creator{display:flex;align-items:center;gap:11px;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-top:22px}.avatar{width:45px;height:45px;border-radius:50%;object-fit:cover;background:#26364a}.creator strong{display:block}.desc{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:13px;margin-top:15px}.muted{color:var(--muted)}.error{color:#ff9292}@media(max-width:700px){.wrap{grid-template-columns:minmax(0,1fr);max-width:480px;margin:18px auto;padding:0 14px;gap:15px}.player{width:min(100%,380px);margin:auto;max-height:none}.details{padding-top:0}}
</style></head><body><header class="top"><a href="./"><span class="mark">▶</span>ER:LC TV</a></header><main class="wrap"><div id="status" class="muted">Loading Short…</div><section id="content" hidden style="display:contents"><div class="player"><iframe id="frame" title="YouTube Short player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div class="details"><h1 id="title" class="title"></h1><div class="meta"><span id="date"></span><a id="youtube" target="_blank" rel="noopener">Watch on YouTube ↗</a></div><a id="channel" class="creator"><img id="avatar" class="avatar" alt=""><span><strong id="channelName"></strong><span class="muted" id="youtubeName"></span></span></a><div id="description" class="desc"></div></div></section></main>
<script>
const API='https://erlctv.gavunblake.workers.dev',id=new URLSearchParams(location.search).get('id'),status=document.getElementById('status');
(async()=>{if(!id){status.textContent='No Short was specified.';status.className='error';return}try{const r=await fetch(API+'/shorts/public?id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Short not found.');const v=d.short;document.title=v.title+' — ER:LC TV';document.getElementById('frame').src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.youtube_short_id);document.getElementById('title').textContent=v.title;document.getElementById('date').textContent='Published '+new Date(v.youtube_published_at*1000).toLocaleDateString();document.getElementById('youtube').href='https://www.youtube.com/shorts/'+encodeURIComponent(v.youtube_short_id);document.getElementById('channel').href='./channel.html?slug='+encodeURIComponent(v.channel_slug);document.getElementById('channelName').textContent=v.channel_name;document.getElementById('youtubeName').textContent=v.youtube_channel_title;if(v.youtube_thumbnail_url)document.getElementById('avatar').src=v.youtube_thumbnail_url;else document.getElementById('avatar').hidden=true;document.getElementById('description').textContent=v.description||'No description provided.';status.hidden=true;document.getElementById('content').hidden=false}catch(e){status.textContent=e.message;status.className='error'}})();
</script></body></html>
