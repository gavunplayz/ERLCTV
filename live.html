<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>Live stream — ER:LC TV</title><style>:root{color-scheme:dark;--bg:#080b10;--panel:#101824;--line:#1e2b3c;--muted:#91a0b4;--text:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(20px,calc((100% - 1150px)/2));font-weight:850;font-size:20px}.mark{display:inline-grid;place-items:center;background:#2388ff;border-radius:10px;width:35px;height:35px;margin-right:10px}.wrap{max-width:1150px;margin:30px auto;padding:0 20px}.player{width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:15px;overflow:hidden}.player iframe{width:100%;height:100%;border:0}.title{font-size:clamp(23px,4vw,34px);line-height:1.2;margin:20px 0 8px}.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted)}.creator{display:flex;align-items:center;gap:11px;padding:17px;background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-top:22px}.avatar{width:45px;height:45px;border-radius:50%;object-fit:cover;background:#26364a}.creator strong{display:block}.desc{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:13px;margin-top:15px}.error{color:#ff9292}.muted{color:var(--muted)}@media(max-width:600px){.wrap{padding:0 12px;margin-top:18px}.player{border-radius:9px}}</style></head><body><header class="top"><a href="./"><span class="mark">▶</span>ER:LC TV</a></header><main class="wrap"><div id="status" class="muted">Loading live stream…</div><section id="content" hidden><div class="player"><iframe id="frame" title="YouTube live stream player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><h1 id="title" class="title"></h1><div class="meta"><span id="date"></span><a id="youtube" target="_blank" rel="noopener">Watch on YouTube ↗</a></div><a id="channel" class="creator"><img id="avatar" class="avatar" alt=""><span><strong id="channelName"></strong><span class="muted" id="youtubeName"></span></span></a><div id="description" class="desc"></div></section></main><script>const API='https://erlctv.gavunblake.workers.dev',id=new URLSearchParams(location.search).get('id'),status=document.getElementById('status');(async()=>{if(!id){status.textContent='No live stream was specified.';status.className='error';return}try{const r=await fetch(API+'/live/public?id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Live stream not found.');const v=d.liveStream;document.title=v.title+' — ER:LC TV';document.getElementById('frame').src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.youtube_video_id)+'?autoplay=1&playsinline=1&rel=0';document.getElementById('title').textContent=v.title;document.getElementById('date').textContent='Listed '+new Date(v.youtube_published_at*1000).toLocaleDateString();document.getElementById('youtube').href='https://www.youtube.com/watch?v='+encodeURIComponent(v.youtube_video_id);document.getElementById('channel').href='./channel.html?slug='+encodeURIComponent(v.channel_slug);document.getElementById('channelName').textContent=v.channel_name;document.getElementById('youtubeName').textContent=v.youtube_channel_title;if(v.youtube_thumbnail_url)document.getElementById('avatar').src=v.youtube_thumbnail_url;else document.getElementById('avatar').hidden=true;document.getElementById('description').textContent=v.description||'No description provided.';status.hidden=true;document.getElementById('content').hidden=false}catch(e){status.textContent=e.message;status.className='error'}})();</script></body></html>
