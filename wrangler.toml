name = "erlctv"
main = "worker.js"
compatibility_date = "2026-11-09"
workers_dev = true
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "erlctv-channels"
database_id = "cf71ec6e-789e-43c4-ab77-4cecd6d584e6"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/auth/*", "/channels*", "/youtube/*"]
